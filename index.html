<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HEART Experience</title>

  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    h1 {
      font-size: 60px;
      margin: 0;
      letter-spacing: 8px;
    }

    .gold {
      color: #c7a76a;
    }

    p {
      color: #b8b8b8;
      font-size: 18px;
    }

    .button {
      margin-top: 25px;
      padding: 14px 28px;
      background: #c7a76a;
      color: #111;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>HEART</h1>

    <p class="gold">
      COFFEE • COCKTAIL • LOUNGE
    </p>

    <p>
      Benvenuti da HEART
    </p>

    <a href="#menu" class="button">
      Apri il menu
    </a>
  </section>

  <section id="menu">
    <h2 class="gold">Il nostro menu</h2>

    <p>Cocktail</p>
    <p>Spritz</p>
    <p>Vini</p>
    <p>Birre</p>
    <p>Caffetteria</p>
    <p>Snack & Stuzzicheria</p>
  </section>

</body>
</html>
